# =====================================================================
# FINAN-X · Modo seguro para demostración (HTTPS en :8443)
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d --build
#   → https://localhost:8443   (certificado autofirmado: aceptar la excepción)
#
# Sirve para mostrar en la sustentación que el proyecto tiene TLS, HSTS y
# cabeceras de seguridad, sin tocar los puertos 80/443 del equipo.
# =====================================================================
services:
  backend:
    environment:
      COOKIE_SECURE: "on"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}

  frontend:
    ports:
      - "8443:443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
