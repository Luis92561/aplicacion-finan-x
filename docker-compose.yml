# =====================================================================
# FINAN-X Â· Stack de demostraciÃ³n / desarrollo (HTTP en :8080)
#
# Para el despliegue real use ademÃ¡s docker-compose.prod.yml (TLS en 80/443).
# La base de datos NO publica puertos: solo es accesible desde la red interna.
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      # postgres es el superusuario del motor y SOLO se usa para inicializar y migrar.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: finanx
      # Clave del rol de aplicaciÃ³n (privilegios mÃ­nimos, sin DDL).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en el archivo .env}
    volumes:
      - finanx_pgdata:/var/lib/postgresql/data
      # init.sql + migraciones + creaciÃ³n del rol de aplicaciÃ³n (orden alfabÃ©tico).
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanx"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    image: finanx-backend:1.0.0
    environment:
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: finanx_app
      PGPASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en el archivo .env}
      PGDATABASE: finanx
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env (mÃ­nimo 32 caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      NODE_ENV: ${NODE_ENV:-production}
      # En la demo local se sirve HTTP, asÃ­ que la cookie no puede ser Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-off}
      OTP_RETORNO_DEMO: ${OTP_RETORNO_DEMO:-off}
      REGISTRO_ABIERTO: ${REGISTRO_ABIERTO:-off}
      SEED_DEMO: "false"
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
    expose:
      - "4000"
    volumes:
      # Las claves temporales de las cuentas iniciales viven fuera de la imagen y se
      # entregan aparte. El contenedor solo las lee para crear las cuentas una vez.
      - ./primer-ingreso:/primer-ingreso:rw
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: finanx-frontend:1.0.0
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finanx_pgdata:
