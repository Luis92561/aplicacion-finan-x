name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar backend y frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar backend
        run: npm ci --prefix backend

      - name: Instalar y compilar frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Verificar sintaxis del backend
        run: node --check backend/src/index.js

  compose:
    name: Validar Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Preparar .env de prueba
        run: bash scripts/generar-env.sh
      - name: Validar los tres perfiles
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.secure.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  imagenes:
    name: Construir imágenes
    runs-on: ubuntu-latest
    needs: compose
    steps:
      - uses: actions/checkout@v5
      - name: Preparar .env de prueba
        run: bash scripts/generar-env.sh
      - name: Construir backend y frontend
        run: docker compose build
